<!DOCTYPE html>
<html>

<head>
  <title>ClearPath - Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="sidebar">
    <div class="logo">L</div>
    <a class="nav-btn" href="./">Chat</a>
    <a class="nav-btn" href="legal.html">Q&amp;A</a>
    <a class="nav-btn active" href="admin.html">Admin</a>
  </div>

  <div id="main">
    <div id="header">
      <div>
        <h2>Case assignment</h2>
        <div class="sub">Give a parent a case, or move them to a different one</div>
      </div>
      <button type="button" id="signOutBtn">Sign out</button>
    </div>

    <div class="admin-body">
      <div id="status" class="admin-status"></div>
      <div id="card" class="admin-card" hidden>
        <table class="admin-table" id="users">
          <thead>
            <tr><th>Email</th><th>Role</th><th>Case</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <datalist id="cases"></datalist>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const statusBox = document.getElementById('status');
    const card = document.getElementById('card');
    const tbody = document.querySelector('#users tbody');
    const caseList = document.getElementById('cases');
    const signOutBtn = document.getElementById('signOutBtn');
    let currentUser = null;

    signOutBtn.addEventListener('click', async () => {
      await signOut(auth);
      location.href = 'login.html';
    });

    async function api(path, options = {}) {
      const token = await currentUser.getIdToken();
      return fetch(path, {
        ...options,
        headers: {
          Authorization: 'Bearer ' + token,
          'Content-Type': 'application/json'
        }
      });
    }

    async function loadUsers() {
      const res = await api('api/admin/users');
      if (res.status === 403) {
        card.hidden = true;
        statusBox.textContent = 'You are not an admin.';
        return;
      }
      if (!res.ok) {
        card.hidden = true;
        statusBox.textContent = 'Could not load users.';
        return;
      }
      const users = await res.json();
      // unassigned users first
      users.sort((a, b) => (a.caseId ? 1 : 0) - (b.caseId ? 1 : 0));

      tbody.innerHTML = '';
      caseList.innerHTML = '';
      const seen = new Set();
      for (const u of users) {
        if (u.caseId && !seen.has(u.caseId)) {
          seen.add(u.caseId);
          const opt = document.createElement('option');
          opt.value = u.caseId;
          caseList.appendChild(opt);
        }
      }

      for (const u of users) {
        const tr = document.createElement('tr');

        const email = document.createElement('td');
        email.textContent = u.email || u.uid;
        const role = document.createElement('td');
        role.textContent = u.role || '';

        const caseCell = document.createElement('td');
        const input = document.createElement('input');
        input.setAttribute('list', 'cases');
        input.placeholder = 'no case';
        input.value = u.caseId || '';
        caseCell.appendChild(input);

        const saveCell = document.createElement('td');
        const save = document.createElement('button');
        save.textContent = 'Save';
        save.addEventListener('click', async () => {
          const value = input.value.trim();
          const res = await api('api/admin/assign', {
            method: 'POST',
            body: JSON.stringify({ uid: u.uid, caseId: value || null })
          });
          statusBox.textContent = res.ok ? 'Saved.' : 'Could not save (use letters, numbers, - or _).';
          if (res.ok) loadUsers();
        });
        saveCell.appendChild(save);

        tr.append(email, role, caseCell, saveCell);
        tbody.appendChild(tr);
      }
      card.hidden = false;
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        location.href = 'login.html';
        return;
      }
      currentUser = user;
      loadUsers();
    });
  </script>
</body>

</html>
