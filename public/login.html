<!DOCTYPE html>
<html>

<head>
  <title>ClearPath - Log in</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="login-body">
  <form id="loginForm" class="login-box">
    <h2>Log in</h2>
    <input id="email" type="email" placeholder="Email" required />
    <input id="password" type="password" placeholder="Password" required />
    <button>Log in</button>
    <button id="signupButton" type="button">Create account</button>
    <div id="loginError"></div>
  </form>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      try {
        const cred = await signInWithEmailAndPassword(
          auth,
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        let dest = './';
        try {
          const token = await cred.user.getIdToken();
          const res = await fetch('api/me', {
            headers: { Authorization: 'Bearer ' + token }
          });
          if (res.ok) {
            const me = await res.json();
            if (me.role === 'admin') dest = 'admin.html';
          }
        } catch (error) {
          // if this fails, just go to the chat page
        }
        location.href = dest;
      } catch (error) {
        loginError.textContent = 'Wrong email or password.';
      }
    });

    document.getElementById("signupButton").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      loginError.textContent = '';

      try {
        const result = await createUserWithEmailAndPassword(auth, email, password);
        const token = await result.user.getIdToken();

        const res = await fetch('api/signup', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!res.ok && res.status !== 409) {
          throw new Error('signup endpoint failed: ' + res.status);
        }

        location.href = './';
      } catch (error) {
        console.error(error);
        loginError.textContent = "Could not create the account.";
      }
    });
  </script>
</body>

</html>
