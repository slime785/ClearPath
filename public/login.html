<!DOCTYPE html>
<html>

<head>
  <title>ClearPath - Log in</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="login-body">
  <form id="loginForm" class="login-box">
    <h2>Log in</h2>
    <input id="username" type="text" placeholder="Username" />
    <input id="email" type="email" placeholder="Email" required />
    <input id="password" type="password" placeholder="Password" required />
    <button>Log in</button>
    <button id="signupButton" type="button">Create account</button>
    <div id="loginError"></div>
  </form>

  <script type="module">
    //import { auth } from './firebase-config.js';
    //import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { auth, db } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    
    import { doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        location.href = '/';
      } catch (error) {
        loginError.textContent = 'Wrong email or password.';
      }
    });
    document.getElementById("signupButton").addEventListener("click", async () => {
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!username) {
    loginError.textContent = "Enter a username.";
    return;
    }

    try {
      const result = await createUserWithEmailAndPassword(auth, email, password);

      await setDoc(doc(db, "users", result.user.uid), {
      username: username,
      createdAt: serverTimestamp()
    });

    location.href = "/";
  } catch (error) {
    console.error(error);
    loginError.textContent = "Could not create the account. Error with Firebase.";
  }
});
  </script>
</body>

</html>
