<!DOCTYPE html>
<html>
<head>
  <title>ClearPath - Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar">
    <div class="logo">L</div>
  </div>

  <div id="main">
    <div id="header">
      <div>
        <h2>Custody Schedule</h2>
        <div class="sub">You &amp; (Whoever other person is)</div>
      </div>
    </div>

    <ul id="messages"></ul>


  <div id="username-area">
    <input id="username" placeholder="Enter your username" />
    <button id="joinButton" type="button">Join Chat</button>
  </div>



    <form id="form">
      <input id="input" autocomplete="off" placeholder="Type a message…" />
      <button>Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    const usernameInput = document.getElementById('username');
    const joinButton = document.getElementById('joinButton');

    let username = '';
    let myId = localStorage.getItem('userId');
    if (!myId) {
      myId = 'user-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('userId', myId);
    }

    input.disabled = true;

    joinButton.addEventListener('click', () => {
      username = usernameInput.value.trim()
      if (username !== ''){
        usernameInput.disabled = true;
        joinButton.disabled = true;
        input.disabled = false;
        input.focus();
      }
    })

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      //check for username and msgs
      if (username !== '' && input.value.trim() !== '') {
        socket.emit('chat message', { senderId: myId, 
          username: username, text: input.value });
        input.value = '';
      }
    });

    socket.on('chat message', (payload) => {
      const item = document.createElement('li');
      item.textContent = `${payload.username}: ${payload.text}`;
      item.className = payload.senderId === myId ? 'sent' : 'received';
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
