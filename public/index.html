<!DOCTYPE html>
<html>
<head>
  <title>Let's Talk - Chat</title>
</head>
<body>
  <ul id="messages"></ul>
  <form id="form">
    <input id="input" autocomplete="off" />
    <button>Send</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    let myId = localStorage.getItem('userId');
    if (!myId) {
      myId = 'user-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('userId', myId);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value) {
        socket.emit('chat message', { senderId: myId, text: input.value });
        input.value = '';
      }
    });

    socket.on('chat message', (payload) => {
      console.log('received:', payload);
      const item = document.createElement('li');
      item.textContent = payload.text;
      item.className = payload.senderId === myId ? 'sent' : 'received';
      messages.appendChild(item);
    });
  </script>
</body>
</html>
